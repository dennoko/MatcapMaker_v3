name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - name: Build and test portable Web edition
        run: |
          pnpm build:single
          pnpm exec playwright install chromium
          pnpm test:single
      - uses: actions/upload-artifact@v4
        with:
          name: single-html
          path: dist-single/MatcapMaker.html
          if-no-files-found: error
      # builds the portable exe + NSIS installer and attaches them to a draft release
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `pnpm check` above verified that the tag matches version.json
          tagName: ${{ github.ref_name }}
          releaseName: Matcap Maker ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: See the assets below. The portable exe needs no installation; SHA256SUMS.txt lists checksums.
      - name: Portable exe + checksums
        shell: pwsh
        run: |
          $ver = (Get-Content version.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/release/matcap-maker.exe "dist-release/MatcapMaker_${ver}_x64_portable.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-release/
          Copy-Item dist-single/MatcapMaker.html "dist-release/MatcapMaker_${ver}_web.html"
          Copy-Item dist-single/MatcapMaker.html dist-release/MatcapMaker_web.html
          Get-ChildItem dist-release -File | Where-Object Extension -in '.exe', '.html' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist-release/SHA256SUMS.txt
          gh release upload "v$ver" dist-release/*_portable.exe dist-release/*.html dist-release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    needs: release
    # Publish exactly the HTML attached to the release, never rebuild it here.
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: single-html
          path: dist-single
      - run: node scripts/check-single.mjs
      - name: Cross-browser offline smoke
        env:
          CROSS_BROWSER: '1'
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          pnpm exec playwright install --with-deps firefox webkit
          pnpm exec playwright test --project firefox --project webkit
      - run: mkdir -p dist-pages && cp dist-single/MatcapMaker.html dist-pages/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-pages }
      - uses: actions/deploy-pages@v4
